name: Tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.name }})
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum supported Home Assistant (hacs.json "homeassistant").
          - name: "HA 2026.3"
            requirement: "pytest-homeassistant-custom-component==0.13.320"
          # Whatever the latest test package pins (latest stable or beta HA).
          - name: "HA latest"
            requirement: "pytest-homeassistant-custom-component"
    steps:
      - uses: "actions/checkout@v7"
      - uses: "actions/setup-python@v7"
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "dev-requirements.txt"
      # uv installs the same pinned packages as pip, several times faster.
      - name: Install test dependencies
        run: |
          python -m pip install uv
          uv pip install --system "${{ matrix.requirement }}" hypothesis==6.170.15
      # Full run, in parallel on every core: 100 % line + branch coverage
      # and the functional-coverage gate (tests/functional_coverage.py) are
      # both enforced.
      - name: Run the test suite
        run: >
          python -m pytest -n auto
          --cov=custom_components/eleven_energy_plus
          --cov-branch --cov-report=term-missing --cov-fail-under=100

  canary:
    # Early warning for the newest Home Assistant, which usually lands before
    # a matching test package. Non-blocking: a failure here is a heads-up.
    name: pytest (newest Home Assistant, canary)
    runs-on: "ubuntu-latest"
    continue-on-error: true
    steps:
      - uses: "actions/checkout@v7"
      - uses: "actions/setup-python@v7"
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "dev-requirements.txt"
      - name: Install newest Home Assistant over the latest test package
        run: |
          python -m pip install uv
          uv pip install --system pytest-homeassistant-custom-component hypothesis==6.170.15
          uv pip install --system --upgrade --no-deps homeassistant
          python tests/compat/install_missing_requirements.py
      - name: Run the test suite
        run: python tests/compat/run_newest_ha.py -n auto
