name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff-vulture:
    name: ruff + vulture
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - uses: "actions/setup-python@v7"
        with:
          python-version: "3.14"
      - run: python -m pip install -r dev-requirements.txt
      - run: ruff check custom_components tests
      - run: vulture custom_components tests vulture_whitelist.py --min-confidence 60

  mypy:
    name: mypy (${{ matrix.name }})
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "HA 2026.3"
            requirement: "pytest-homeassistant-custom-component==0.13.320"
          - name: "HA latest"
            requirement: "pytest-homeassistant-custom-component"
    steps:
      - uses: "actions/checkout@v7"
      - uses: "actions/setup-python@v7"
        with:
          python-version: "3.14"
      - run: python -m pip install "${{ matrix.requirement }}" mypy==2.4.1
      - run: mypy custom_components/eleven_energy_plus
