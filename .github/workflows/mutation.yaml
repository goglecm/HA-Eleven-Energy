name: Mutation testing

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutmut:
    runs-on: "ubuntu-latest"
    timeout-minutes: 240
    steps:
      - uses: "actions/checkout@v7"
      - uses: "actions/setup-python@v7"
        with:
          python-version: "3.14"
      - run: python -m pip install -r dev-requirements.txt
      - run: mutmut run --max-children 4
      - run: mutmut results
      # Fails if any mutant survives that is not justified in
      # tests/mutation_report.md.
      - run: python tests/tools/check_mutants.py
