name: Mutation testing

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutmut:
    # The mutants are split into shards by function (tests/tools/
    # mutation_shards.py), one job each, all running at once. Every job
    # checks its own survivors against tests/mutation_report.md; together
    # they cover every mutant exactly once. The shard count here and in the
    # two commands below must agree.
    name: mutmut (shard ${{ matrix.shard }} of 8)
    runs-on: "ubuntu-latest"
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: "actions/checkout@v7"
      - uses: "actions/setup-python@v7"
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "dev-requirements.txt"
      - run: |
          python -m pip install uv
          uv pip install --system -r dev-requirements.txt
      - run: python tests/tools/mutation_shards.py run ${{ matrix.shard }} 8 --max-children 4
      # Fails if a mutant of this shard survives that is not justified in
      # tests/mutation_report.md, or a justified one no longer survives.
      - run: python tests/tools/check_mutants.py --shard ${{ matrix.shard }} --of 8
