# Structure only. Names, descriptions and field labels live in
# translations/en.json (the "services" section), which is where Home Assistant
# reads them from.
#
# No `target` is declared. Home Assistant's validator refuses a device filter
# inside a service target and says to use a device selector instead, and a
# declared target is shown as required: automations written without one -
# which is most of them, since a single-inverter site needs none - would show
# "No target set". The inverter is therefore an optional `device_id` field
# with a device selector. `device_id` and `entity_id` are still accepted in
# the call, so automations written against earlier definitions keep resolving
# to the same inverter. On a site with more than one inverter, a call without
# one is refused rather than guessed.
#
# Ranges here are the UI limits. The action schemas (services.py) validate
# every call - YAML included - and accept target powers up to 50 kW, the API's
# own ceiling.
#
# No `response` key either: hassfest no longer accepts one. That every action
# can optionally return a response is declared in code
# (`supports_response=SupportsResponse.OPTIONAL` in services.py).

set_work_mode_self_consumption:
  fields:
    device_id:
      required: false
      selector:
        device:
          integration: eleven_energy_plus
    percent_to_battery:
      required: false
      example: 100
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider

set_work_mode_force_charge:
  fields:
    device_id:
      required: false
      selector:
        device:
          integration: eleven_energy_plus
    target_power:
      required: true
      example: 3.5
      selector:
        number:
          min: 0
          max: 20
          step: 0.1
          unit_of_measurement: kW
          mode: box
    target_percent:
      required: true
      example: 100
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider

