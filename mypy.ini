[mypy]
python_version = 3.14
strict = True
warn_unused_ignores = True
warn_unreachable = True
show_error_codes = True
# Third-party packages without type information (none are imported by the
# integration itself; this keeps tooling imports from failing the run).
ignore_missing_imports = True

# HA 2026.4 - 2026.10 re-export BinarySensorDeviceClass from
# binary_sensor/const.py with ``# noqa: F401`` but without ``__all__``; it is
# the documented public import path (and the only one that exists on the
# 2026.3 floor, where it is defined in binary_sensor/__init__.py).
[mypy-homeassistant.components.binary_sensor]
implicit_reexport = True
