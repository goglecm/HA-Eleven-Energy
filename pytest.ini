[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Deprecation warnings raised by this integration's own code fail the run.
# Home Assistant's own deprecation reports for custom integrations are logged
# rather than warned; tests/conftest.py fails any test during which one
# mentions eleven_energy_plus.
filterwarnings =
    error::DeprecationWarning:custom_components\.eleven_energy_plus.*
    ignore::pluggy.PluggyTeardownRaisedWarning
addopts =
    -ra
    --strict-markers
    --strict-config
    -p no:cacheprovider
