[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    defect(id): regression test for a ledger defect (tests/DEFECTS.md); must fail on the baseline commit (tests/tools/check_red.py)
    guard(id): sweep case for a ledger defect class where the code was already correct; kept as a guard test
    covers(*ids): functional-coverage model items exercised by this test (tests/functional_coverage.py)
# Deprecation warnings raised by this integration's own code fail the run.
# Home Assistant's own deprecation reports for custom integrations are logged
# rather than warned; tests/conftest.py fails any test during which one
# mentions eleven_energy_plus.
filterwarnings =
    error::DeprecationWarning:custom_components\.eleven_energy_plus.*
    ignore::pluggy.PluggyTeardownRaisedWarning
addopts =
    -ra
    --strict-markers
    --strict-config
    -p no:cacheprovider
